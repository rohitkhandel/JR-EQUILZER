name: Build JR-EQUILZER v2.0.0 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jr-equalizer-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Run DSP unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build installable debug APK and optimized release variant
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload v2.0.0 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JR-EQUILZER-v2.0.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: JR-EQUILZER-v2.0.0-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
